name: Release-APK

# Baut ein signiertes APK. Auslöser: ein Tag wie v0.2.0 (hängt das APK an ein GitHub-Release)
# oder ein manueller Start (APK als Download am Lauf). Der Signaturschlüssel kommt aus den Repository-Secrets.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests (core)
        run: ./gradlew :core:test --no-daemon

      - name: Signaturschlüssel bereitstellen
        env:
          HC_KEYSTORE_BASE64: ${{ secrets.HC_KEYSTORE_BASE64 }}
          HC_KEYSTORE_PASSWORD: ${{ secrets.HC_KEYSTORE_PASSWORD }}
          HC_KEY_ALIAS: ${{ secrets.HC_KEY_ALIAS }}
          HC_KEY_PASSWORD: ${{ secrets.HC_KEY_PASSWORD }}
        run: |
          for name in HC_KEYSTORE_BASE64 HC_KEYSTORE_PASSWORD HC_KEY_ALIAS HC_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Das Secret $name fehlt (Settings > Secrets and variables > Actions)."
              exit 1
            fi
          done
          echo "$HC_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/hc-release.jks"
          echo "HC_KEYSTORE_FILE=$RUNNER_TEMP/hc-release.jks" >> "$GITHUB_ENV"

      - name: Version festlegen
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="0.0.${GITHUB_RUN_NUMBER}-manuell"; fi
          echo "HC_VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "HC_VERSION_CODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Release-APK bauen
        env:
          HC_KEYSTORE_PASSWORD: ${{ secrets.HC_KEYSTORE_PASSWORD }}
          HC_KEY_ALIAS: ${{ secrets.HC_KEY_ALIAS }}
          HC_KEY_PASSWORD: ${{ secrets.HC_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: APK prüfen und benennen
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          # Der Fingerabdruck ist öffentlich und muss bei jedem Release derselbe sein, sonst lässt sich nicht aktualisieren.
          "$APKSIGNER" verify --print-certs "$APK" | grep "SHA-256"
          cp "$APK" "FamilyManager-${HC_VERSION_NAME}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: FamilyManager-APK
          path: FamilyManager-*.apk

      - name: GitHub-Release anlegen
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: FamilyManager-*.apk
          generate_release_notes: true
